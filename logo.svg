<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Mantica — modern map satchel</title>
  <desc>Minimal colorful vector icon combining a travel satchel, map, route and compass.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1479D1"/>
      <stop offset="1" stop-color="#35B8E8"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B95E32"/>
      <stop offset="1" stop-color="#74351F"/>
    </linearGradient>
    <linearGradient id="map" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9F3B0"/>
      <stop offset=".48" stop-color="#8BCB69"/>
      <stop offset="1" stop-color="#43A86B"/>
    </linearGradient>
  </defs>

  <!-- MapLibre-like rounded map canvas -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg)"/>

  <!-- abstract terrain -->
  <path d="M48 275 Q125 220 190 260 T335 245 T464 215 V420H48Z"
        fill="#1769B0" opacity=".48"/>
  <path d="M48 315 Q130 265 210 305 T350 290 T464 265 V420H48Z"
        fill="#0F5799" opacity=".34"/>

  <!-- folded map -->
  <path d="M91 142 L183 111 L328 139 L421 108 V306 L328 335 L183 306 L91 337Z"
        fill="url(#map)" stroke="#F8F5E9" stroke-width="10"
        stroke-linejoin="round"/>

  <!-- map folds -->
  <path d="M183 111V306 M328 139V335"
        stroke="#2D7F65" stroke-width="7" opacity=".5"/>

  <!-- river -->
  <path d="M111 184 Q151 155 173 190 T223 207 Q248 220 268 190 T313 168"
        fill="none" stroke="#28A9E8" stroke-width="15"
        stroke-linecap="round"/>

  <!-- topographic contours -->
  <path d="M128 263 Q162 226 196 247 T257 247"
        fill="none" stroke="#D4E98A" stroke-width="7" opacity=".85"/>
  <path d="M142 283 Q175 251 205 267 T259 268"
        fill="none" stroke="#D4E98A" stroke-width="5" opacity=".7"/>

  <!-- route -->
  <path d="M151 278 C190 292 211 260 225 239
           C240 217 253 224 269 235
           C291 250 307 225 324 207
           C340 190 351 181 369 181"
        fill="none" stroke="#FFF9E9" stroke-width="10"
        stroke-linecap="round" stroke-dasharray="17 15"/>

  <!-- destination pin -->
  <path d="M369 142 C342 142 322 163 322 189
           C322 222 369 250 369 250
           C369 250 416 222 416 189
           C416 163 396 142 369 142Z"
        fill="#F45B3C"/>
  <circle cx="369" cy="188" r="13" fill="#FFF9E9"/>

  <!-- travel satchel: the meaning of mantica -->
  <path d="M75 310 Q75 287 101 287 H411 Q437 287 437 310
           L425 422 Q422 445 397 445 H115 Q90 445 87 422Z"
        fill="url(#bag)"/>

  <!-- satchel flap -->
  <path d="M72 309 Q76 286 104 286 H408 Q436 286 440 309
           L425 351 Q418 369 397 369 H115 Q94 369 87 351Z"
        fill="#A94F2B"/>

  <!-- straps -->
  <path d="M117 293V432 M395 293V432"
        stroke="#5E2A1B" stroke-width="24" stroke-linecap="round"/>
  <path d="M117 298V425 M395 298V425"
        stroke="#C66A38" stroke-width="13" stroke-linecap="round"/>

  <!-- buckles -->
  <rect x="96" y="332" width="42" height="45" rx="9" fill="#F2C35B"/>
  <rect x="374" y="332" width="42" height="45" rx="9" fill="#F2C35B"/>
  <rect x="107" y="342" width="20" height="24" rx="4" fill="#7A351F"/>
  <rect x="385" y="342" width="20" height="24" rx="4" fill="#7A351F"/>

  <!-- compass emblem -->
  <circle cx="256" cy="358" r="47" fill="#7A351F" opacity=".65"/>
  <circle cx="256" cy="358" r="39" fill="none" stroke="#D9824B" stroke-width="4"/>
  <path d="M256 325 L266 358 L256 391 L246 358Z" fill="#F2C35B"/>
  <path d="M223 358 L256 348 L289 358 L256 368Z" fill="#D9824B"/>
  <circle cx="256" cy="358" r="6" fill="#FFF2D0"/>

  <!-- subtle highlight -->
  <path d="M104 397 Q160 414 211 410" fill="none"
        stroke="#E88954" stroke-width="6" stroke-linecap="round" opacity=".45"/>
</svg>
